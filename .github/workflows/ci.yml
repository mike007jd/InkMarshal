# Enforce the package-owned quality gates on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: novelcraft-ai
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version-file: novelcraft-ai/.node-version
          cache: pnpm
          cache-dependency-path: novelcraft-ai/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: novelcraft-ai/src-tauri
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run application quality gates
        run: |
          pnpm verify
          pnpm verify:security

  desktop:
    name: Desktop Rust + macOS bundled boot smoke
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: novelcraft-ai/src-tauri
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version-file: novelcraft-ai/.node-version
          cache: pnpm
          cache-dependency-path: novelcraft-ai/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: novelcraft-ai/src-tauri
      # bundle.resources paths must exist before cargo checks; node/ and
      # next-server/ are generated later by build:desktop-web.
      - run: mkdir -p resources/next-server resources/node resources/engines
      - name: Run desktop quality gates
        working-directory: novelcraft-ai
        run: pnpm verify:desktop
      - name: Install dependencies
        working-directory: novelcraft-ai
        run: pnpm install --frozen-lockfile
      - name: Build and smoke the macOS bundled runtime
        working-directory: novelcraft-ai
        run: |
          pnpm build:desktop-web
          pnpm smoke:desktop
